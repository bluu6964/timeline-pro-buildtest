name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native text layers: FreeType (glyph drawing) + HarfBuzz (shaping, Bengali conjuncts) are downloaded the
      # same way. If a download fails the app still builds; text is then drawn with the Android Canvas.
      - name: Get FreeType and HarfBuzz source
        run: |
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype app/src/main/cpp/freetype \
            && rm -rf app/src/main/cpp/freetype/.git || rm -rf app/src/main/cpp/freetype
          git clone --depth 1 --branch 10.1.0 https://github.com/harfbuzz/harfbuzz app/src/main/cpp/harfbuzz \
            && rm -rf app/src/main/cpp/harfbuzz/.git || rm -rf app/src/main/cpp/harfbuzz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Debug APK — fast iteration, but Compose is slower at runtime.
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      # Release APK — signed for installation. If release secrets are absent,
      # Gradle uses the debug key as a TEST fallback (not for Play Store distribution).
      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon

      # APKs go to a GitHub Release (not to Actions artifacts, whose storage quota can fill up).
      # Download them from the repo's "Releases" page. Only the newest 5 releases are kept.
      - name: Publish APKs to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/*.apk "tracket-debug-${TAG}.apk"
          cp app/build/outputs/apk/release/*.apk "tracket-release-${TAG}.apk"
          # Idempotent publish: a re-run of this run (same run_number, same tag) must replace the
          # release an earlier attempt already created instead of failing on the duplicate tag
          # (build 138 attempt 2 went red on exactly this, after a fully green Gradle build).
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" tracket-debug-*.apk tracket-release-*.apk \
            --title "Build ${{ github.run_number }}" --notes "Commit ${{ github.sha }}" --prerelease
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes || true

      # Build 234: the pure-compute engine modules are native-only (their Kotlin
      # fallbacks were removed), so the JVM unit tests need a desktop build of
      # libam_engine.so on the library path — the same C++ sources the NDK build
      # compiles. audio_decoder.h is stubbed: the NDK decoder cannot exist on a
      # desktop JVM, so the two fd-based entry points return null there (the
      # unit tests never call them).
      - name: Build host JNI library for unit tests
        run: |
          set -e
          mkdir -p /tmp/hostlib/shim
          cat > /tmp/hostlib/shim/audio_decoder.h <<'EOF'
          #pragma once
          #include <cstdint>
          #include <memory>
          #include "audio_dsp.h"
          namespace am {
          class AudioFileSource : public FrameSource {
           public:
            static std::unique_ptr<AudioFileSource> open(int, int64_t, int64_t) { return nullptr; }
            int read(float*, int) override { return 0; }
          };
          }  // namespace am
          EOF
          E=app/src/main/cpp/engine
          cp $E/audio_analysis_jni.cpp /tmp/hostlib/shim/
          # shape_boolean.cpp is compiled without FP contraction, exactly as
          # the app's CMakeLists does (FMA contraction flips its tangent-
          # vertex sign test and tangent-disc unions come back empty).
          g++ -std=c++17 -O2 -fPIC -ffp-contract=off \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I$E \
            -c $E/shape_boolean.cpp -o /tmp/hostlib/shape_boolean.o
          g++ -std=c++17 -O2 -fPIC -shared -Wall -Wextra \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I$E \
            -o /tmp/hostlib/libam_engine.so \
            $E/audio_analysis.cpp /tmp/hostlib/shim/audio_analysis_jni.cpp \
            $E/frame_eval.cpp $E/frame_eval_jni.cpp \
            $E/gif_engine.cpp $E/gif_jni.cpp \
            $E/project_doc.cpp $E/project_doc_jni.cpp \
            $E/scene_math.cpp $E/scene_math_jni.cpp \
            $E/scope_stats.cpp $E/scope_stats_jni.cpp \
            /tmp/hostlib/shape_boolean.o $E/shape_boolean_jni.cpp \
            $E/canvas_gesture.cpp $E/canvas_gesture_jni.cpp \
            $E/lk_tracker.cpp $E/lk_tracker_jni.cpp \
            -lm

      - name: Unit tests
        run: |
          # UiGlVectorCmdTest's premise is a JVM with NO native library (it
          # asserts UiGlRuntime reports unsupported there, and the runtime's
          # failure path logs via android.util.Log, unmocked in unit tests).
          # Exclude it from the with-library run and run it separately in
          # exactly its intended environment.
          cat > /tmp/exclude-uigl.gradle <<'EOF'
          gradle.allprojects { tasks.withType(Test).configureEach { exclude 'com/example/UiGlVectorCmdTest.class' } }
          EOF
          LD_LIBRARY_PATH=/tmp/hostlib gradle testDebugUnitTest --no-daemon -I /tmp/exclude-uigl.gradle
          gradle testDebugUnitTest --no-daemon --tests "com.example.UiGlVectorCmdTest"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 1
